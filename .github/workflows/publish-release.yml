name: Publish Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'chore(release): v')
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Upgrade npm (OIDC publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Compute release metadata
        id: meta
        run: |
          package_name="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('package.json','utf8')).name)")"
          version="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('package.json','utf8')).version)")"
          tag="v$version"

          if [[ "$version" == *-* ]]; then
            prerelease_segment="${version#*-}"
            preid="${prerelease_segment%%.*}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "dist_tag=$preid" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: |
          if npm view "${{ steps.meta.outputs.package_name }}@${{ steps.meta.outputs.version }}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Version already exists on npm; skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public --tag "${{ steps.meta.outputs.dist_tag }}"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          scope="${{ steps.meta.outputs.package_name }}"
          if [[ "$scope" == @*/* ]]; then
            scope="${scope%%/*}"
          else
            echo "Package name must be scoped to publish to GitHub Packages."
            exit 1
          fi

          npm config set "${scope}:registry" "https://npm.pkg.github.com"
          if npm view "${{ steps.meta.outputs.package_name }}@${{ steps.meta.outputs.version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Version already exists on GitHub Packages; skipping GitHub Packages publish."
            exit 0
          fi

          npm publish --registry=https://npm.pkg.github.com --tag "${{ steps.meta.outputs.dist_tag }}"

      - name: Create and push tag
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
            exit 0
          fi

          args=("$tag" "--target" "$GITHUB_SHA" "--generate-notes")
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            args+=("--prerelease")
          fi
          gh release create "${args[@]}"
